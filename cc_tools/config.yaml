name: CC Tools Dev
version: "1.0.68"
slug: cc_tools
description: Automatiza tareas de Creality Cloud desde Home Assistant.
url: https://github.com/micasadomotica/CC-Tools-Dev-HA
# Imagen precompilada publicada por .github/workflows/publish.yml. Al no construirse
# en el equipo, Supervisor ya no guarda la imagen Docker dentro de cada backup.
image: ghcr.io/micasadomotica/cc-tools-dev-ha
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
webui: "http://[HOST]:[PORT:8080]"
ports:
  8080/tcp: 8088
ports_description:
  8080/tcp: Interfaz web de CC Tools Dev (8088 por defecto)
options:
  timezone: Europe/Madrid
  migration_source: No migrar
  migration_confirm: false
schema:
  timezone: str
  migration_source: list(No migrar|CC Tools Dev local|CC Tools de TitoTB)
  migration_confirm: bool

# Only needed during an explicitly requested migration; protection stays on by default.
docker_api: true
hassio_api: true
hassio_role: default

map:
  - type: media
    read_only: false

# Datos regenerables que no deben ocupar espacio en los backups. Rutas relativas a /data.
# Se conservan la sesión (cookies, almacenamiento del sitio), la configuración y los registros.
backup_exclude:
  - temp-downloads
  - screenshots
  - browser-session/chromium/*/Cache
  - browser-session/chromium/*/Code Cache
  - browser-session/chromium/*/GPUCache
  - browser-session/chromium/*/DawnGraphiteCache
  - browser-session/chromium/*/DawnWebGPUCache
  - browser-session/chromium/*/Service Worker/CacheStorage
  - browser-session/chromium/*/Service Worker/ScriptCache
  - browser-session/chromium/GrShaderCache
  - browser-session/chromium/GraphiteDawnCache
  - browser-session/chromium/ShaderCache
  - browser-session/chromium/component_crx_cache
  - browser-session/chromium/extensions_crx_cache
  - browser-session/chromium/optimization_guide_model_store
  - browser-session/chromium/Crashpad
  # Descargas que Playwright deja al conectarse a Chromium externo; se vacían al iniciarlo.
  - browser-session/chromium/cdp-downloads
  # Respaldos privados de cada migración (copia completa del origen y de los datos
  # anteriores). Se conserva state.json; las copias se borran 7 días después de terminar.
  - .cc-tools-migration/*-*-*-*-*
